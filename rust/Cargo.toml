[package]
name = "netra_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "netra_rust"
path = "ffi/mod.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "2.11.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.11", features = ["v4"] }
once_cell = "1.20"
